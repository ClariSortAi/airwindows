name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    name: Policy and repository checks
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ./scripts/check.ps1
      - run: python -m pytest app/tests/test_frames.py
      - run: python scripts/check-repository.py
  build:
    name: Build receiver and frame checks
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            app/.deps/vcpkg/downloads
            app/.deps/vcpkg_installed
            ~/AppData/Local/vcpkg/archives
          key: windows-2022-vcpkg-${{ hashFiles('app/scripts/bootstrap.ps1', 'app/vcpkg.json', 'app/vcpkg-ports/**') }}
      - run: ./app/scripts/bootstrap.ps1
      - run: ./app/scripts/build.ps1 -Target AirWindowsNative
      - run: ./app/scripts/build.ps1 -Target FrameServerCheck
      - run: ./app/build/Release/bin/FrameServerCheck.exe
      - run: ./app/scripts/package.ps1 -Release -OutDir ./app/dist/ci
      - run: python scripts/check-package.py app/dist/ci
