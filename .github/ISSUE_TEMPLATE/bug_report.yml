name: Bug report
description: Report a receiver, Bluetooth input or build problem
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: App version or commit, Windows version, Bluetooth adapter, and phone/iOS version.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected result and actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or checks
      description: Remove personal data. State whether you tested with a real phone.
